name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Import check
        run: python -c "import github_mcp_safe.server, github_mcp_safe.rate_limiter, github_mcp_safe.github_client"
